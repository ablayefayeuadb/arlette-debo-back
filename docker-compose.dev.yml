# Développement : PostgreSQL 16 dans Docker (l'API tourne en local avec `mvn spring-boot:run`).
#   docker compose -f docker-compose.dev.yml up -d
# Bases : arlette_debo (dev) et arlette_debo_test (tests) — utilisateur arlette / arlette_dev.
# Justificatifs : dossier local backend/var/storage (non versionné), aucun service à lancer.
# Les extensions (pg_trgm, citext, btree_gist) sont créées par Flyway (V1).
name: arlette-debo-dev
services:
  db:
    image: postgres:16-alpine
    container_name: arlette-debo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arlette_debo
      POSTGRES_USER: arlette
      POSTGRES_PASSWORD: arlette_dev
      TZ: Africa/Dakar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arlette -d arlette_debo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:
